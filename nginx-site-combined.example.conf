# Reference: full site for getcraftedpixel.com (static HTML on VPS).
# Copy to VPS: /etc/nginx/sites-available/getcraftedpixel.com
# Symlink: sudo ln -s /etc/nginx/sites-available/getcraftedpixel.com /etc/nginx/sites-enabled/
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx
#
# Requirements:
#   - Brotli: sudo apt install libnginx-mod-brotli   (Ubuntu 22+)
#             If unavailable, comment out all brotli_* lines safely.
#   - Pre-compressed assets: run scripts/compress-assets.sh on VPS after each deploy
#     (generates .gz + .br sidecar files → gzip_static / brotli_static serve them at zero CPU cost)
#
# Cloudflare note:
#   If Lighthouse still shows Cache TTL "None", CF may strip Cache-Control on origin response.
#   Fix: CF → Rules → Cache Rules → set "Cache Control TTL" per path pattern.
#
# Structure:
#   1) HTTP  → HTTPS redirect
#   2) HTTPS → main site + performance config

# ── Load Brotli module (comment out if not installed) ──────────────────────────
# On Ubuntu 22+ with libnginx-mod-brotli the module loads via /etc/nginx/modules-enabled/
# If you installed manually: load_module modules/ngx_http_brotli_filter_module.so;
#                            load_module modules/ngx_http_brotli_static_module.so;

# ── HTTP → HTTPS ───────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name getcraftedpixel.com www.getcraftedpixel.com;
    return 301 https://getcraftedpixel.com$request_uri;
}

# ── www → non-www (HTTPS) ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.getcraftedpixel.com;
    ssl_certificate     /etc/letsencrypt/live/getcraftedpixel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getcraftedpixel.com/privkey.pem;
    return 301 https://getcraftedpixel.com$request_uri;
}

# ── Main HTTPS server ──────────────────────────────────────────────────────────
server {
    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;

    server_name getcraftedpixel.com;

    ssl_certificate     /etc/letsencrypt/live/getcraftedpixel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getcraftedpixel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # If nginx -t says file not found: sudo openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # TLS tuning: ssl_protocols, ssl_prefer_server_ciphers, ssl_session_*
    # are all set by /etc/letsencrypt/options-ssl-nginx.conf — do NOT duplicate here.

    # HSTS (1 year) — enable only after you're sure HTTPS is permanent
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/html;
    index index.html index.htm;

    # ── TCP / connection optimizations ────────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;   # batch headers + beginning of file in one packet
    tcp_nodelay on;   # disable Nagle after keep-alive handshake
    keepalive_timeout 65;
    keepalive_requests 1000;

    # ── Gzip (on-the-fly, fallback when .gz sidecar not found) ───────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2
        font/woff;

    # Serve pre-compressed .gz files if they exist (zero CPU, set by compress-assets.sh)
    gzip_static on;

    # ── Brotli (comment out if libnginx-mod-brotli not installed) ─────────────
    brotli on;
    brotli_comp_level 4;
    brotli_static on;   # serve pre-compressed .br files
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        font/woff;

    # ── 404 page ──────────────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        access_log off;
        internal;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static asset caching ──────────────────────────────────────────────────
    # Fonts (immutable — fingerprint them or use long URLs from Google/gstatic)
    location ~* \.(woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*";
    }

    # If self-hosting fonts in /assets/fonts/ — same rule applies via ~* above.

    # CSS / JS (versioned via ?v= or content hash in filename → immutable OK)
    location ~* \.(css|js|mjs)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Images
    location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 60d;
        add_header Cache-Control "public, max-age=5184000" always;
    }

    # Explicit prefix rules (take priority over regex above for these paths)
    location ^~ /css/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location ^~ /js/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location ^~ /assets/fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*";
    }
    location ^~ /assets/vendor/font-awesome/webfonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*";
    }
    location ^~ /assets/ {
        expires 60d;
        add_header Cache-Control "public, max-age=5184000" always;
    }

    # ── HTML: no-cache so search engines always get fresh content ─────────────
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Clean URLs: /about → serves about.html ────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
