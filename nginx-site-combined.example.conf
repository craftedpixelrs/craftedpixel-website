# Reference: full site for getcraftedpixel.com (static HTML).
# Copy to VPS as a guide — adjust paths if your certs differ.
# Active file on Ubuntu is usually: /etc/nginx/sites-available/default
#
# Cloudflare: ako Lighthouse i dalje kaže Cache TTL "None", origin možda šalje
# Cache-Control ali CF ga ne prosleđuje browseru. U CF → Rules → Transform Rules
# dodaj "Set response header" Cache-Control za /css/*, /js/*, /assets/*.
#
# Meta tags (http-equiv) do NOT set cache lifetimes for CSS/JS/fonts/images.
# Use Cache-Control / Expires from Nginx (below) or Cloudflare cache rules.
#
# Structure:
#   1) server { }  port 80  → redirect to HTTPS
#   2) server { }  port 443 → SSL + root + cache locations + try_files

# --- HTTP → HTTPS (Certbot-style) ---
server {
    if ($host = www.getcraftedpixel.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = getcraftedpixel.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name getcraftedpixel.com www.getcraftedpixel.com;
    return 404;
}

# --- HTTPS (sve SSL linije MORAJU biti unutar ovog server { } ) ---
server {
    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/getcraftedpixel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getcraftedpixel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # If nginx -t says file not found, comment next line or run: sudo openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_name getcraftedpixel.com www.getcraftedpixel.com;

    root /var/www/html;
    index index.html index.htm;

    # Nepostojeće stranice → 404.html (HTTP 404, nije 302 redirect)
    error_page 404 /404.html;
    location = /404.html {
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

    location ^~ /css/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location ^~ /js/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location ^~ /assets/vendor/font-awesome/webfonts/ {
        expires 180d;
        add_header Cache-Control "public, max-age=15552000, immutable" always;
    }
    location ^~ /assets/ {
        expires 60d;
        add_header Cache-Control "public, max-age=5184000" always;
    }

    location ~* \.(css|js|mjs)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location ~* \.(woff2|woff|ttf|otf)$ {
        expires 180d;
        add_header Cache-Control "public, max-age=15552000, immutable" always;
    }
    location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 60d;
        add_header Cache-Control "public, max-age=5184000" always;
    }

    # Clean URLs: /about → about.html (same idea as your Apache rewrite)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
