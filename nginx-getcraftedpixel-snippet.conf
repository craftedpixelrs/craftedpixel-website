# Paste INSIDE your existing server { } block for getcraftedpixel.com (after root / index).
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Fixes Lighthouse "Cache TTL: None" when using Nginx (.htaccess is ignored).
#
# Cloudflare: ako TTL i dalje "None" u Lighthouse, dodaj Transform Rule koja postavlja
# Cache-Control za /css/, /js/, /assets/ — ili Browser Cache TTL = Respect Existing Headers
# kad origin šalje zaglavlja.
# Email Obfuscation injects /cdn-cgi/ scripts; short TTL there is expected unless disabled in CF.

# Nepostojeći URL → custom 404.html (uz status 404)
error_page 404 /404.html;
location = /404.html {
    access_log off;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

# Prefix matches (^~) win over generic "location /" and avoid "cache headers missing" if regex never runs.
location ^~ /css/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
}
location ^~ /js/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
}
location ^~ /assets/vendor/font-awesome/webfonts/ {
    expires 180d;
    add_header Cache-Control "public, max-age=15552000, immutable" always;
}
location ^~ /assets/ {
    expires 60d;
    add_header Cache-Control "public, max-age=5184000" always;
}

# Fallback: extension-based (covers odd paths, e.g. /img/ without /assets/)
location ~* \.(css|js|mjs)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
}

# Fonts — longer + immutable (bytes rarely change)
location ~* \.(woff2|woff|ttf|otf)$ {
    expires 180d;
    add_header Cache-Control "public, max-age=15552000, immutable" always;
}

# Images / SVG
location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
    expires 60d;
    add_header Cache-Control "public, max-age=5184000" always;
}
