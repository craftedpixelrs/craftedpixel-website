# Paste INSIDE your existing server { } block for getcraftedpixel.com (after root / index).
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Fixes Lighthouse "Cache TTL: None" when using Nginx (.htaccess is ignored).

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

# Long cache for versioned-looking static files (bump ?v= on deploy if you change files without rename)
location ~* \.(css|js|mjs)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico|woff2|woff|ttf|otf)$ {
    expires 60d;
    add_header Cache-Control "public, max-age=5184000";
}
