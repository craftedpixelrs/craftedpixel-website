  <style>
    /* Draw-on-load: stroke traces path, then fill fades in (pathLength normalizes dash math). */
    @keyframes logo-draw {
      0% {
        stroke-dashoffset: 1;
        fill-opacity: 0;
      }
      62% {
        stroke-dashoffset: 0;
        fill-opacity: 0;
      }
      100% {
        stroke-dashoffset: 0;
        fill-opacity: 1;
        stroke-width: 0;
      }
    }
    .logo-icon path,
    .logo-word path {
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      vector-effect: non-scaling-stroke;
      animation: logo-draw 0.72s cubic-bezier(0.45, 0, 0.2, 1) forwards;
    }
    .logo-icon path {
      fill: #0967FB;
      stroke: #0967FB;
      stroke-width: 1.2;
    }
    .logo-word path {
      fill: #ffffff;
      stroke: #ffffff;
      stroke-width: 0.85;
    }
    .logo-icon path:nth-child(1) { animation-delay: 0s; }
    .logo-icon path:nth-child(2) { animation-delay: 0.1s; }
    .logo-word path:nth-child(1) { animation-delay: 0.32s; }
    .logo-word path:nth-child(2) { animation-delay: 0.365s; }
    .logo-word path:nth-child(3) { animation-delay: 0.41s; }
    .logo-word path:nth-child(4) { animation-delay: 0.455s; }
    .logo-word path:nth-child(5) { animation-delay: 0.5s; }
    .logo-word path:nth-child(6) { animation-delay: 0.545s; }
    .logo-word path:nth-child(7) { animation-delay: 0.59s; }
    .logo-word path:nth-child(8) { animation-delay: 0.635s; }
    .logo-word path:nth-child(9) { animation-delay: 0.68s; }
    .logo-word path:nth-child(10) { animation-delay: 0.725s; }
    .logo-word path:nth-child(11) { animation-delay: 0.77s; }
    .logo-word path:nth-child(12) { animation-delay: 0.815s; }
    @media (prefers-reduced-motion: reduce) {
      .logo-icon path,
      .logo-word path {
        animation: none !important;
        stroke-width: 0 !important;
        stroke-dasharray: none !important;
        stroke-dashoffset: 0 !important;
        fill-opacity: 1 !important;
      }
    }
  </style>
